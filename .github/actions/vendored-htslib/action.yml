# Make lib/<platform>/libhts.a present and usable, then hand back to the job.
#
# Every job that compiles divstats needs this, and it was pasted into two of
# them. The other four -- header-deps, warnings, the release build matrix, and
# any job added later -- inherited nothing, so removing the non-PIC lib/linux
# archive broke them one at a time as each was reached. That is what a composite
# action is for: `uses: ./.github/actions/vendored-htslib` is one line, and a
# new job cannot forget half of it.
#
# htslib.yml deliberately does NOT use this. Building the archive from source
# and testing against it IS that workflow's subject, so it calls the script
# directly.
name: Vendored htslib
description: Ensure the vendored static htslib for this platform exists and is linkable.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail

        # One invocation, captured and echoed. When this step failed on the
        # Windows runner the log held nothing from make at all, because both
        # invocations were piped into something -- so there was no way to see
        # what it had actually said.
        # 2>&1 and the explicit failure path: a command substitution swallows
        # output, so if `make info` itself fails the log would again say
        # nothing about why. Show it either way.
        if ! info="$(make -C src info 2>&1)"; then
          echo "$info"
          echo "make -C src info failed; nothing below can be trusted" >&2
          exit 1
        fi
        echo "$info"

        plat="$(basename "$(awk '/^L_PATH/ {print $3}' <<< "$info")")"
        archive="lib/$plat/libhts.a"

        # A FILE TEST, not a grep for make's "MISSING" wording. The condition
        # for building is whether the archive exists; tying that to the exact
        # text of a diagnostic, through a pipeline, under pipefail, is how this
        # step skipped the build on the Windows runner and then failed on the
        # very file it had just declined to build. `make info` remains the
        # authority on WHICH archive this platform wants -- that is a value it
        # prints, not a sentence.
        if [ -f "$archive" ]; then
          echo "using the committed $archive"
        else
          echo "no committed archive for $plat; building one from source"
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y zlib1g-dev
          fi
          ./lib/build_htslib.sh "$plat"
        fi

        # Run on a committed archive as well as a freshly built one: an archive
        # can exist and still be unlinkable, which is how the non-PIC lib/linux
        # archive got in. build_htslib.sh runs the same script on what it
        # produces.
        ./lib/check_htslib.sh "$archive"
