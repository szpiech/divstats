# Build divstats and run the golden-file regression suite on every push.
#
# The suite is the point of this workflow. It compares this build's output
# against tests/expected/ column by column, so a job failing here names the
# statistic that moved -- see tests/run_tests.sh. The other jobs guard
# defects this repo has already shipped once:
#
#   sanitizers   -- 2.0.0 fixed a heap over-read in pi_k2 and an
#                   unconditional release of uninitialised pointers in
#                   calc_stats. Both are invisible to a golden-file
#                   comparison when the indeterminate values happen to be
#                   benign, which is why 1.0.0's distributed binary ran and a
#                   clean rebuild of the same source segfaulted.
#   header-deps  -- the Makefile declared no header dependencies until 2.0.0,
#                   so editing a header left stale objects linked against the
#                   old declarations (segsites() int -> double printed
#                   S = 5.66e+07). This job proves the edges are still there.
#   warnings     -- a ceiling, not a clean build. Lower MAX_WARNINGS as the
#                   count comes down; it can then never rise silently.
#   windows      -- MSYS2/MinGW64. Guards more than compilation: the goldens
#                   are LF, so a pass is also proof that output is not being
#                   written CRLF by a stream left in text mode.
#
# Every job that compiles goes through ./.github/actions/vendored-htslib
# first, which makes lib/<platform>/libhts.a present -- building it from source
# when the platform has none committed -- and checks that it is actually
# linkable before the linker gets it. Add that one line to any new compiling
# job; four of the jobs here once did the work inline or not at all, and each
# one broke separately the day lib/linux/libhts.a was removed.
#
# Rebuilding the archive as a deliverable, and uploading it per platform, is a
# separate workflow (htslib.yml) because it needs the network and a few
# minutes.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's verdict irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build + suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform's failure must not hide the other's result: a numeric
      # difference that shows up only on x86_64 is the interesting case.
      fail-fast: false
      matrix:
        # ubuntu-latest and macos-latest have a committed libhts.a;
        # ubuntu-24.04-arm does not yet, and the step below builds it one.
        # arm64 Linux runners are free for public repositories.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # Worth pasting into a bug report, and it says plainly when the platform
      # has no vendored archive.
      - name: Toolchain and vendored archive
        run: make -C src info

      # Builds the archive from source (~2 min) on a platform that has none, so
      # a new runner architecture can be tested before anyone commits a
      # multi-megabyte binary for it, and checks whatever archive will be
      # linked -- committed or just built. Shared by every job here that
      # compiles, because keeping it inline meant four jobs did not have it.
      - uses: ./.github/actions/vendored-htslib

      - name: Build
        run: make -C src -j4

      - name: Regression suite
        run: ./tests/run_tests.sh

      # On failure the useful artefact is the scratch directory: the actual
      # .divstats.out tables beside the goldens they disagree with. The
      # comparator names the column; the tables show the pattern.
      - name: Keep the failing outputs
        if: failure()
        run: |
          set +e
          out="$(./tests/run_tests.sh --keep)"
          printf '%s\n' "$out"
          dir="$(printf '%s\n' "$out" | sed -n 's/^scratch kept: //p')"
          mkdir -p failure-outputs
          [ -n "$dir" ] && cp -R "$dir" failure-outputs/scratch
          cp -R tests/expected failure-outputs/expected
          exit 0
      - name: Upload the failing outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: suite-outputs-${{ matrix.os }}
          path: failure-outputs
          if-no-files-found: warn

  sanitizers:
    name: ASan + UBSan (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/vendored-htslib

      # OPT feeds CXXFLAGS, which the Makefile uses for both compiling and
      # linking, so -fsanitize reaches the link line without a second variable.
      - name: Build instrumented
        run: make -C src -j4 CXX=clang++ OPT="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined"

      # abort_on_error / halt_on_error turn a sanitizer report into a nonzero
      # exit, which the suite then reports as a failing case instead of
      # swallowing it.
      #
      # detect_leaks=0: LeakSanitizer does not run on macOS, so leaving it on
      # would make this job's verdict depend on the runner OS. Leaks in a
      # short-lived CLI are a separate concern from memory errors; to audit
      # them, set detect_leaks=1 here and expect htslib to show up.
      - name: Regression suite under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./tests/run_tests.sh

  # Windows, built with the MinGW-w64 toolchain under MSYS2. Kept out of the
  # build-test matrix because it needs a different shell and a toolchain
  # install first, which a matrix leg cannot express.
  #
  # This is the one compiling job that does NOT use
  # ./.github/actions/vendored-htslib, and not by oversight: a composite
  # action's run steps name their own shell, and the runner's `bash` on
  # windows-latest is Git Bash -- a different installation from the MSYS2
  # environment set up below, without the mingw-w64 toolchain on PATH. The
  # five lines are therefore repeated here against the same two scripts, which
  # remain the source of truth.
  windows:
    name: MSYS2 MinGW64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          # Pinned image contents rather than a full pacman -Syu: faster, and a
          # break is then attributable to a change here rather than to whatever
          # upstream moved that morning.
          update: false
          # curl, tar and bzip2 are for build_htslib.sh, which fetches and
          # unpacks the htslib release tarball. diffutils supplies cmp and
          # coreutils md5sum/mktemp, both of which the suite uses. gawk is
          # explicit because the comparator is awk.
          install: >-
            make
            gawk
            gzip
            tar
            bzip2
            curl
            diffutils
            coreutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-zlib

      - name: Toolchain and vendored archive
        run: make -C src info

      - name: Vendored htslib
        run: |
          set -euo pipefail
          # Same logic as ./.github/actions/vendored-htslib, which this job
          # cannot use (see above). Captured and echoed rather than piped, and
          # conditioned on the archive FILE rather than on make's "MISSING"
          # wording: the pipeline-and-grep form returned false on this runner
          # with the archive absent, skipped the build, and then failed on the
          # missing file -- with no make output in the log to say why.
          if ! info="$(make -C src info 2>&1)"; then
            echo "$info"
            echo "make -C src info failed; nothing below can be trusted" >&2
            exit 1
          fi
          echo "$info"
          plat="$(basename "$(awk '/^L_PATH/ {print $3}' <<< "$info")")"
          archive="lib/$plat/libhts.a"
          if [ -f "$archive" ]; then
            echo "using the committed $archive"
          else
            echo "no committed archive for $plat; building one from source"
            ./lib/build_htslib.sh "$plat"
          fi
          ./lib/check_htslib.sh "$archive"

      - name: Build
        run: make -C src -j4

      # Two things beyond "does it compile": the suite's goldens are LF, so a
      # pass here is also the check that output is not being written CRLF; and
      # the binary is divstats.exe, which run_tests.sh has to resolve.
      - name: Regression suite
        run: ./tests/run_tests.sh

      - name: Keep the failing outputs
        if: failure()
        run: |
          mkdir -p failure-outputs
          cp -r "${TMPDIR:-/tmp}"/divstats-tests.* failure-outputs/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: suite-outputs-windows
          path: failure-outputs
          if-no-files-found: warn

  header-deps:
    name: incremental rebuild picks up header edits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vendored-htslib

      - name: Build, touch a header, rebuild
        run: |
          set -euo pipefail
          make -C src -j4
          before="$(stat -c %Y src/divstats-data.o)"
          # make compares timestamps, so the touch has to land strictly after
          # the object was written.
          sleep 1
          touch src/divstats-data.h
          make -C src
          after="$(stat -c %Y src/divstats-data.o)"
          if [ "$before" = "$after" ]; then
            echo "divstats-data.o was NOT rebuilt after its header changed;" >&2
            echo "the HEADERS dependency in src/Makefile has regressed." >&2
            exit 1
          fi
          echo "rebuilt as expected"
      - name: Suite still passes after the incremental rebuild
        run: ./tests/run_tests.sh

  warnings:
    name: -Wall -Wextra ceiling
    runs-on: ubuntu-latest
    env:
      # Measured on the 2.0.0 tree with clang: 16 -Wsign-compare,
      # 8 -Wunused-variable, 1 -Wunused-but-set-variable, and one real find --
      # -Wsometimes-uninitialized on hapData in divstats-main.cpp, where
      # neither the TPED nor the VCF branch is taken. The headroom absorbs
      # compiler-version drift; lower the ceiling as the count drops.
      MAX_WARNINGS: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/vendored-htslib

      - name: Count warnings
        run: |
          set -euo pipefail
          # clang, not the Makefile's default g++: the ceiling was measured
          # with clang, and the two compilers do not warn alike.
          make -C src -j4 CXX=clang++ OPT="-O2 -Wall -Wextra" 2>&1 | tee build.log
          n="$(grep -c 'warning:' build.log || true)"
          echo "::notice::$n warnings (ceiling $MAX_WARNINGS)"
          # || true: grep exits 1 on no match, and pipefail would then fail
          # the step for the good case of a clean build.
          { grep 'warning:' build.log || true; } | sed -E 's/.*\[(-W[a-z-]+)\]/\1/' | sort | uniq -c | sort -rn
          if [ "$n" -gt "$MAX_WARNINGS" ]; then
            echo "warning count $n exceeds the ceiling $MAX_WARNINGS" >&2
            exit 1
          fi
